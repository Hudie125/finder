name: Release Builds (Windows & Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies (Ubuntu / Arch cross)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Finder v__VERSION__'
          releaseBody: |
            ## Finder v__VERSION__ Release 🚀
            
            ### ✨ What's New:
            * **Monochrome UI + Liquid Glass**: Apple macOS / VisionOS inspired frosted glass aesthetics with fluid spring animations.
            * **Whisper Voice Search & Commands**: Instant voice transcription and hands-free app launching and system commands.
            * **Free Cloud AI Assistant**: Direct streaming answers, code generation, and reasoning.
            * **Universal App Launcher & Window Switcher**: Lightning-fast indexing of installed applications and active GUI windows.
            * **Live Hardware Telemetry & Weather**: Real-time CPU, RAM, GPU monitor and local weather forecasts.
            * **Cross-Platform Adaptations**: Native support and automated installers for Windows 10/11 and Arch Linux.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
