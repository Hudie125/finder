name: Release Builds (Windows & Linux)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: finder-windows-x64
            target_bin: src-tauri/target/release/finder.exe
          - os: ubuntu-22.04
            platform: linux
            artifact_name: finder-linux-x64
            target_bin: src-tauri/target/release/finder

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libgtk-3-dev libxdo-dev

      - name: Build Release Binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.target_bin }}

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Package Release Assets
        run: |
          mkdir -p dist
          if [ -f "release-artifacts/finder-windows-x64/finder.exe" ]; then
            cp "release-artifacts/finder-windows-x64/finder.exe" "dist/Finder-Setup-Windows-x64.exe"
          fi
          if [ -f "release-artifacts/finder-linux-x64/finder" ]; then
            cp "release-artifacts/finder-linux-x64/finder" "dist/finder-linux-x64"
            chmod +x "dist/finder-linux-x64"
            tar -czvf "dist/finder-linux-x64.tar.gz" -C dist finder-linux-x64
          fi
          ls -la dist

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.2' }}
          name: Finder ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.2' }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/*
            install.ps1
            install.sh
            PKGBUILD
          body: |
            ## Finder — Monochrome Liquid Glass Spotlight 🚀

            ### ✨ Key Features:
            * **Monochrome UI + Liquid Glass**: Apple macOS & VisionOS inspired frosted glass, subtle specular borders, and fluid spring animations.
            * **Whisper Voice Recognition & Commands**: Voice search, launch applications by voice, lock PC, check weather, or start timers.
            * **Free Cloud AI Assistant**: Streaming markdown answers with syntax-highlighted code blocks (no API keys required!).
            * **Universal App Indexer & Window Switcher**: Lightning-fast indexing of installed apps and open GUI windows on Windows & Linux.
            * **Scientific Calculator & Currency Converter**: Instant evaluation and currency conversion.
            * **System Telemetry**: Live CPU load, RAM usage, and GPU monitor.

            ### 📦 Download & Install:
            * **Windows 10 / 11**: Download `Finder-Setup-Windows-x64.exe` or run `install.ps1`.
            * **Arch Linux**: Download `finder-linux-x64.tar.gz`, run `./install.sh`, or install via `PKGBUILD`.
