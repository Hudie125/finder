[package]
name = "finder"
version = "2.0.4"
description = "Monochrome Liquid Glass Spotlight Launcher for Windows and Arch Linux"
authors = ["Dima"]
edition = "2021"

[[bin]]
name = "finder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
tokio = { version = "1", features = ["full"] }
walkdir = "2.5"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"

[profile.dev]
incremental = false
debug = 0

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
